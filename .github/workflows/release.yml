name: Release

# Runs only when a version tag is pushed, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
on:
  push:
    tags:
      - 'v*'

defaults:
  run:
    working-directory: CassandraNet

jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Tag must match the crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import json,sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='cngateway'))")
          test "v$version" = "$TAG" || { echo "tag $TAG does not match cngateway version $version"; exit 1; }

      - name: Build release binaries
        run: cargo build --release --locked -p cngateway -p cnagent -p cncli -p cnsdk_c --features cngateway/db

      - name: Package
        run: |
          dist="cassandranet-$TAG-x86_64-linux"
          mkdir -p "$dist/lib" "$dist/include"
          cp target/release/cngateway target/release/cnagent target/release/cncli "$dist/"
          cp target/release/libcassandra_c.so target/release/libcassandra_c.a "$dist/lib/"
          cp cnsdk_c/include/cassandra.h "$dist/include/"
          cp ../LICENSE ../README.md ../CHANGELOG.md .env.example "$dist/"
          tar -czf "$dist.tar.gz" "$dist"
          sha256sum "$dist.tar.gz" > "$dist.tar.gz.sha256"

      - name: Extract release notes
        run: |
          # Plain prefix matching: no regex escaping to differ between awks.
          awk -v head="## [${TAG#v}]" '
            index($0, head) == 1 {on=1; next}
            on && index($0, "## [") == 1 {exit}
            on {print}
          ' ../CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "CHANGELOG.md has no section for ${TAG#v}"; exit 1; }

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$TAG" in v0.*|*-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" $prerelease \
            --title "CassandraNet $TAG" \
            --notes-file release-notes.md \
            "cassandranet-$TAG-x86_64-linux.tar.gz" \
            "cassandranet-$TAG-x86_64-linux.tar.gz.sha256"

  images:
    runs-on: ubuntu-latest
    needs: binaries
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [gateway, agent, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name
        id: name
        # GHCR repository names must be lowercase.
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          name="${{ matrix.image }}"
          [ "$name" = frontend ] && name=console
          echo "ref=ghcr.io/$owner/cassandranet-$name" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: CassandraNet
          file: CassandraNet/docker/Dockerfile.${{ matrix.image }}
          push: true
          tags: |
            ${{ steps.name.outputs.ref }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
