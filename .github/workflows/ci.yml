name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

# The Rust workspace, Go module and frontends all live under CassandraNet/.
defaults:
  run:
    working-directory: CassandraNet

jobs:
  lint-test:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: CassandraNet

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo clippy (database feature)
        run: cargo clippy -p cngateway --all-targets --features db --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: CassandraNet/peripherals/go.mod

      - name: Go vet & test
        working-directory: CassandraNet/peripherals
        run: go vet ./... && go test ./...

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: CassandraNet/frontend/console/package-lock.json

      - name: npm ci
        working-directory: CassandraNet/frontend/console
        run: npm ci

      - name: npm run lint
        working-directory: CassandraNet/frontend/console
        run: npm run lint

      - name: npm run build
        working-directory: CassandraNet/frontend/console
        run: npm run build

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: cassandra
          POSTGRES_PASSWORD: cassandra
          POSTGRES_DB: cassandra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cassandra"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CARGO_TERM_COLOR: always
      CASS_TEST_DATABASE_URL: postgres://cassandra:cassandra@localhost:5432/cassandra_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: CassandraNet

      - name: Migrations + Postgres stores against a fresh database
        run: cargo test -p cncore --features db --locked --test postgres

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build gateway image
        run: docker build -f docker/Dockerfile.gateway -t cassandranet/gateway:ci .

      - name: Build agent image
        run: docker build -f docker/Dockerfile.agent -t cassandranet/agent:ci .

      - name: Build console image
        run: docker build -f docker/Dockerfile.frontend -t cassandranet/console:ci .
