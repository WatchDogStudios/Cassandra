syntax = "proto3";
package cassandra.agent.v1;

// Agent registration request sent once at startup.
message RegisterAgentRequest {
  string node_id = 1;         // provided by agent (uuid or generated)
  string hostname = 2;        // host name
  string os = 3;              // OS identifier
  string arch = 4;            // CPU architecture
  uint32 cpu_cores = 5;       // logical core count
  uint64 memory_bytes = 6;    // total memory
  string secret = 7;          // bootstrap secret/token
  string tenant_id = 8;       // optional tenant association
  string project_id = 9;      // optional project association
}

message RegisterAgentResponse {
  string assigned_id = 1;     // canonical id assigned by server
  string session_token = 2;   // short lived session token (jwt placeholder)
  uint32 heartbeat_interval_seconds = 3;
}

// Heartbeat includes resource samples.
message HeartbeatRequest {
  string assigned_id = 1;
  double cpu_percent = 2;              // between 0 and 100
  uint64 memory_used_bytes = 3;        // resident
  uint64 network_rx_bytes = 4;         // cumulative
  uint64 network_tx_bytes = 5;         // cumulative
  uint64 timestamp_unix_ms = 6;        // client capture time
}

message HeartbeatResponse {
  bool ok = 1;             // server accepted
  bool rotate_credentials = 2; // server requesting credential rotation
  repeated AgentJob jobs = 3;  // work claimed for this agent since the last heartbeat
  uint32 heartbeat_interval_seconds = 4; // desired interval from the agent's config (0 = keep)
}

// Work dispatched to an agent. `kind` is one of: restart, shutdown, exec,
// collect_logs, deploy_build, script. `args_json` is a JSON object whose
// fields depend on the kind.
message AgentJob {
  string job_id = 1;
  string kind = 2;
  string args_json = 3;
  uint32 timeout_seconds = 4;
}

message ReportJobResultRequest {
  string assigned_id = 1;
  string job_id = 2;
  bool success = 3;
  int32 exit_code = 4;     // meaningful when has_exit_code
  bool has_exit_code = 5;
  string stdout = 6;
  string stderr = 7;
  string error = 8;        // why the job failed before/while running, if it did
}

message ReportJobResultResponse {
  bool ok = 1;
}

message DownloadBuildRequest {
  string build_id = 1;
}

// Streamed in order; the first chunk carries the metadata.
message BuildChunk {
  bytes data = 1;
  string filename = 2;
  uint64 size_bytes = 3;
  string checksum_sha256 = 4;
}

service AgentControl {
  rpc RegisterAgent(RegisterAgentRequest) returns (RegisterAgentResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc ReportJobResult(ReportJobResultRequest) returns (ReportJobResultResponse);
  rpc DownloadBuild(DownloadBuildRequest) returns (stream BuildChunk);
}
